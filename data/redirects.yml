# redirects.yml — 中継ページ（/r/<slug>/）の単一情報源
#
# 設計: docs/aiseo/phase_9_redirects_design.md
# 承認プラン: ~/.claude/plans/cryptic-sniffing-cerf.md
#
# 1エントリ = 1中継ページ = /r/{slug}/index.html を build_redirects.py が生成。
# sitemap.xml / llms.txt には載せない（noindex / nofollow の中継ページ）。
# robots.txt の Disallow: /r/ は入れない（CODEX レビュー反映、noindex を読めなくする事故防止）。
#
# 公開後の slug は immutable。dest_url を変えたい場合は新 slug を切る。
# 旧 slug は active: false にして物理削除しない（既存被リンクからの 404 防止）。
#
# category: brain | coconala | line_bot
# active: false にすると build_redirects.py は HTML を新規生成しない（既存ファイルは保持）

