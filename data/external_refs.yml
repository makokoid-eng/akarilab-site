# 本番の助成金ポータルは ChatGPT Sites の Private Site。
# 全パスがサインイン必須になるため、客向けページから直リンクしてはいけない。
# 例外は /owner/ のみ（robots.txt で Disallow 済みの運用ページ）。
forbidden_in_public_pages:
  - pattern: akari-josei-portal.akarilab.chatgpt.site
    reason: 非公開サイト。客が開くとサインイン画面で止まる。
    allowed_in:
      - owner/index.html
      - makoto/services/grant-portal/demo/index.html      # 経緯説明のHTMLコメントのみ
      - makoto/services/grant-portal/thanks/index.html    # 経緯説明のHTMLコメントのみ
      - makoto/services/attendance-ocr/thanks/index.html  # 経緯説明のHTMLコメントのみ
