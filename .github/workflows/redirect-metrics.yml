name: redirect-metrics

# 週次でGA4 から redirect_click イベントを取得 →
# docs/redirect-reports/{YYYY-WW}.md を更新 → GitHub Issue 起票。
# 設計: docs/aiseo/phase_9_redirects_design.md §自動観察

on:
  schedule:
    # 毎週月曜 09:00 JST = 月曜 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: '集計期間（日数、既定7）'
        required: false
        default: '7'
      no_fetch:
        description: 'GA4 を叩かず空データでレポート生成（デバッグ用）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml google-analytics-data google-api-python-client google-auth google-auth-oauthlib
          echo "--- installed Google packages ---"
          pip list | grep -i google || echo "(no google packages found)"
          echo "--- python sanity check ---"
          python -c "from google.analytics.data_v1beta import BetaAnalyticsDataClient; print('google.analytics.data_v1beta OK')"
          python -c "from google.oauth2 import service_account; print('google.oauth2 OK')"
          python -c "from googleapiclient.discovery import build; print('googleapiclient OK')"

      - name: Compute week label
        id: week
        run: |
          WEEK_LABEL=$(python -c "from datetime import datetime, timezone, timedelta; \
            now = datetime.now(timezone(timedelta(hours=9))); \
            iso = now.isocalendar(); \
            print(f'{iso.year}-W{iso.week:02d}')")
          echo "label=$WEEK_LABEL" >> "$GITHUB_OUTPUT"

      - name: Run metrics collector
        id: collect
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          NO_FETCH_FLAG=""
          if [ "${{ github.event.inputs.no_fetch }}" = "true" ]; then
            NO_FETCH_FLAG="--no-fetch"
          fi
          python scripts/collect_redirect_metrics.py \
            --days "$DAYS" \
            --out "docs/redirect-reports/${{ steps.week.outputs.label }}.md" \
            $NO_FETCH_FLAG \
            > /tmp/report.md
          echo "report_path=docs/redirect-reports/${{ steps.week.outputs.label }}.md" >> "$GITHUB_OUTPUT"

      # TLS証明書の期限監視。GitHub Pages は通常30日前に自動更新するので、
      # 残り14日未満は「自動更新が走っていない」異常サインとして警告する
      - name: Check TLS certificate expiry
        run: |
          {
            echo ""
            echo "## TLS証明書期限"
            echo ""
          } > /tmp/cert.md
          for d in akarilab.org demo.akarilab.org; do
            exp=$(echo | openssl s_client -servername "$d" -connect "$d:443" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$exp" ]; then
              echo "- ⚠️ $d: 証明書を取得できず（接続失敗。発行停止や期限切れの可能性）" >> /tmp/cert.md
              continue
            fi
            days=$(( ($(date -d "$exp" +%s) - $(date +%s)) / 86400 ))
            if [ "$days" -lt 14 ]; then
              echo "- ⚠️ $d: 残り ${days}日（$exp）— GitHub の自動更新が走っていない可能性。Pages 設定を確認" >> /tmp/cert.md
            else
              echo "- $d: 残り ${days}日（$exp）" >> /tmp/cert.md
            fi
          done
          cat /tmp/cert.md >> /tmp/report.md
          cat /tmp/cert.md >> "${{ steps.collect.outputs.report_path }}"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/redirect-reports/
          if git diff --staged --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "chore(redirect-metrics): weekly report ${{ steps.week.outputs.label }}"
            git push
          fi

      - name: Ensure issue label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create redirect-report \
            --color FBCA04 \
            --description "週次リダイレクト計測レポート" \
            -R ${{ github.repository }} \
            || echo "label already exists"

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="redirect-metrics ${{ steps.week.outputs.label }}"
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/report.md \
            --label "redirect-report"
        continue-on-error: true

      # Phase 10: sales tracker への自動転記
      # SALES_TRACKER_SHEET_ID Secret が未設定なら script が ERROR で終了するが、
      # continue-on-error で workflow 全体は失敗しない（Sheets 未準備でも動く）
      - name: Sync clicks to sales tracker sheet
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          SALES_TRACKER_SHEET_ID: ${{ secrets.SALES_TRACKER_SHEET_ID }}
        run: python scripts/sync_clicks_to_sheets.py
        continue-on-error: true
